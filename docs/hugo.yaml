# yaml-language-server: $schema=https://www.schemastore.org/hugo.json

# git-credential-oauth.nickfedor.com Hugo Configuration

baseURL: https://git-credential-oauth.nickfedor.com/
locale: en-us
title: git-credential-oauth

# https://gohugo.io/getting-started/configuration/#ignorelogs
ignoreLogs: ["warning-goldmark-raw-html"]

# The site has no tags or categories, so the empty listing pages are not built.
# https://gohugo.io/configuration/all/#disablekinds
disableKinds: ["taxonomy", "term"]

# https://gohugo.io/configuration/imaging/
imaging:
  anchor: Smart
  resampleFilter: Lanczos
  jpeg:
    quality: 85
  webp:
    compression: lossy
    hint: photo
    method: 6
    quality: 88
    useSharpYuv: false
  avif:
    compression: lossy
    encoderSpeed: 1
    hint: photo
    quality: 88

# https://gohugo.io/configuration/menus/
menus:
  main:
    - name: Getting Started
      pageRef: /getting-started
      weight: 1
    - name: Forges
      pageRef: /forges
      weight: 2
    - name: Troubleshooting
      pageRef: /troubleshooting
      weight: 3
    - name: CLI Reference
      pageRef: /cli-reference
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/nicholas-fedor/git-credential-oauth"
      params:
        icon: github
    - name: Theme Toggle
      weight: 7
      params:
        type: theme-toggle
        label: true

# https://gohugo.io/configuration/module/
module:
  imports:
    - path: github.com/imfing/hextra

# https://gohugo.io/configuration/params/
params:
  description: "A Git credential helper that signs in to forges with OAuth"

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # https://imfing.github.io/hextra/docs/guide/configuration/#page-edit-link
  editURL:
    enable: true
    base: "https://github.com/nicholas-fedor/git-credential-oauth/edit/main/docs/content"

  # https://imfing.github.io/hextra/docs/guide/configuration/#external-link-decoration
  externalLinkDecoration: true

  # https://imfing.github.io/hextra/docs/guide/configuration/#footer
  footer:
    displayCopyright: true
    displayPoweredBy: false

  # https://imfing.github.io/hextra/docs/guide/syntax-highlighting/#copy-button
  highlight:
    copy:
      enable: true
      display: hover

  # https://imfing.github.io/hextra/docs/guide/configuration/#image-zoom
  imageZoom:
    enable: true

  # https://imfing.github.io/hextra/docs/guide/configuration/#logo-and-title
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg

  page:
    contextMenu:
      enable: true

  # https://imfing.github.io/hextra/docs/guide/configuration/#theme-configuration
  theme:
    default: system
    displayToggle: false

# https://imfing.github.io/hextra/docs/guide/configuration/#llmstxt-support
outputs:
  home:
    - html
    - llms
    - markdown
  section:
    - html
    - markdown
  page:
    - html
    - markdown
